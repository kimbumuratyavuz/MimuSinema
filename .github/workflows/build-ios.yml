name: Build MimuSinema iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-runner:
    name: Check Runner
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: echo "Ubuntu runner works!"

  build:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: test-runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project MimuSinema.xcodeproj \
            -scheme MimuSinema \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MimuSinema.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/MimuSinema.xcarchive/Products/Applications/MimuSinema.app Payload/
          zip -r MimuSinema.ipa Payload
          ls -la MimuSinema.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MimuSinema-iOS-IPA
          path: MimuSinema.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MimuSinema v1.0.${{ github.run_number }}
          files: MimuSinema.ipa
          body: |
            🎉 **MimuSinema iOS IPA Hazır!**
            
            - **Kurulum:** İndirdiğiniz `MimuSinema.ipa` dosyasını Windows bilgisayarınızda **Sideloadly**, **AltStore** veya **TrollStore** kullanarak iPhone'unuza yükleyebilirsiniz.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
