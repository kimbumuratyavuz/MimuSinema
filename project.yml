name: MimuSinema
options:
  bundleIdPrefix: com.mimusinema
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    PRODUCT_NAME: MimuSinema
    SWIFT_VERSION: "5.9"
    INFOPLIST_FILE: StreamVOD/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  MimuSinema:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StreamVOD
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mimusinema.app
      INFOPLIST_FILE: StreamVOD/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO
